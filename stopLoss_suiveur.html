es":{"table":0,"price":0,"asm":0,"flag":0}},"TRAIL":0.05,"P_LO":80,"K":286.81088753437115,"ZP0":39,"GAP":14.71147528785516,"PEN_X":30,"PAPER":{"x0":-70,"x1":100,"z0":31,"z1":175},"MIN":87,"MAX":121,"TAKE":{"x":-70,"r":8,"kind":"take","y":-25.9}};
const PRICE_TRAVEL = 94.61387165327253, ASM_TRAVEL = 94.61387165327253, FLAG_TRAVEL = 9, Z_PRICE0 = 63.05812286820529, Z_PEAK0 = 63.05812286820529, ZP0 = 39, K = 286.81088753437115, MIN = 87, P_LO = 80;
const follow = (v) => ({
  table: v.table ?? 0,
  price: Math.max(0, Math.min(PRICE_TRAVEL, K * (v.lp ?? Math.log(MIN / P_LO)) + ZP0 - Z_PRICE0)),
  asm: Math.max(0, Math.min(ASM_TRAVEL, K * (v.la ?? Math.log(MIN / P_LO)) + ZP0 - Z_PEAK0)),
  flag: FLAG_TRAVEL * Math.max(0, Math.min(1, v.flag ?? 0)),
});
const { TRAIL, PEN_X, PAPER, GAP } = DATA;
const MAXP = DATA.MAX;
const SPEED = 7, REARM = 2.8;
const LN_KEEP = Math.log(1 - TRAIL);
const zOfL = (l) => ZP0 + K * l;
const Lof = (p) => Math.log(p / P_LO);
const pOf = (l) => P_LO * Math.exp(l);
const fr = (p) => p.toFixed(2).replace(".", ",");
const LMIN = Lof(MIN), LMAX = Lof(MAXP);
const clampL = (l) => Math.max(LMIN, Math.min(LMAX, l));

const stage = document.querySelector(".ts3-stage");
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
let tool = false, frame = 0;
const controller = TURN.mount(stage, DATA.turn, { follow, onHold: () => { tool = true; if (frame) cancelAnimationFrame(frame); frame = 0; } });
const el = (name) => stage.querySelector('[data-ts="' + name + '"]');
const E = { price: el("price"), stop: el("stop"), grid: el("grid"), marks: el("marks") };

// ---- Modèle du stop suiveur ----
const M = { lp: Lof(100), target: Lof(100), peak: Lof(100), asm: Lof(100), sold: false, soldClock: 0, sale: 0, entry: 100, flag: 0, flagRate: 0, pen: true };
let paperPos = 0, clock = 0, rearmedAt = -10, lastSample = -1;
const samples = [], marks = [];
function stepModel(dt, calm) {
  M.lp += (M.target - M.lp) * (calm ? 1 : 1 - Math.exp(-dt / 0.12));
  if (!M.sold) {
    if (M.lp > M.peak) M.peak = M.lp; // le cliquet : le plus haut ne fait que monter
    if (M.lp <= M.peak + LN_KEEP) {
      M.sold = true; M.soldClock = 0; M.sale = pOf(M.peak + LN_KEEP); M.pen = false;
      marks.push({ at: paperPos, l: M.peak + LN_KEEP });
    }
  }
  if (M.sold) {
    M.soldClock += dt;
    if (M.soldClock > REARM) { M.sold = false; M.peak = M.lp; M.entry = pOf(M.lp); rearmedAt = clock; }
  }
  const want = M.sold ? M.asm : M.peak;
  M.asm = want < M.asm ? M.asm + (want - M.asm) * (calm ? 1 : 1 - Math.exp(-dt / 0.16)) : want;
  if (M.lp > M.asm) M.asm = M.lp;

  if (paperPos - lastSample < 0.5) return;

  while (samples.length && PEN_X - (paperPos - samples[0].at) < PAPER.x0 - 6) samples.shift();
  while (marks.length && PEN_X - (paperPos - marks[0].at) < PAPER.x0 - 6) marks.shift();
}

// ---- Visite : hausse, repli < 5 %, nouveau sommet, rechute > 5 % ----
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
let legs = [], legClock = 0, legFrom = Lof(100);
function planCycle() {
  const p0 = Math.max(90, Math.min(105, pOf(M.lp)));
  const top = Math.min(117, p0 * (1.09 + rand() * 0.06));
  const mid = p0 + (top - p0) * (0.45 + rand() * 0.15);
  legs = [[mid, 2.2], [mid * (0.965 - rand() * 0.008), 1.3], [top, 2.4], [top * 0.988, 0.7], [top * 1.002, 0.6], [top * 0.9, 2.6], [top * 0.905, 2.4]].map(([p, t]) => [Lof(p), t]);
  legClock = 0; legFrom = M.target;
}
const wiggle = (t) => 0.0032 * Math.sin(t * 2.3) + 0.0021 * Math.sin(t * 5.1 + 1.3) + 0.0012 * Math.sin(t * 9.7 + 0.4);
function tourPrice(dt) {
  if (!legs.length) planCycle();

  let [l, t] = legs[0];
  if (legClock >= t) { legFrom = l; legs.shift(); legClock -= t; if (!legs.length) planCycle(); [l, t] = legs[0]; }
  const u = Math.min(1, legClock / t), s = u * u * (3 - 2 * u);
  return clampL(legFrom + (l - legFrom) * s + wiggle(clock));
}

// ---- Rotation du plateau ----
let angle = -18, angleTarget = -18, turnClock = 0;
const tourAngle = (t) => -18 + 34 * Math.sin(t * 0.16);

// ---- Dessin ----
const num = (v) => v.toFixed(2);
const X = (at) => PEN_X - (paperPos - at);
function traces() {
  let price = "", stop = "", open = false, m = "";
  for (const s of samples) {
    const x = X(s.at);
    price += (price ? "L" : "M") + num(x) + " " + num(zOfL(s.lp));
    if (s.ls === null) { open = false; continue; }
    if (!open && x > PAPER.x0 + 4) m += '<circle class="ts3-start" cx="' + num(x) + '" cy="' + num(zOfL(s.ls)) + '" r="0.9"/>';
    stop += (open ? "L" : "M") + num(x) + " " + num(zOfL(s.ls)); open = true;
  }
  price += "L" + num(PEN_X) + " " + num(zOfL(M.lp));
  if (M.pen) stop += (open ? "L" : "M") + num(PEN_X) + " " + num(zOfL(M.peak + LN_KEEP));
  E.price.setAttribute("d", price);
  E.stop.setAttribute("d", stop);
  let grid = "";
  for (let x = PAPER.x1 - (paperPos % 18); x > PAPER.x0; x -= 18) grid += "M" + num(x) + " " + PAPER.z0 + "V" + PAPER.z1;
  E.grid.setAttribute("d", grid);
  for (const mk of marks) {
    const cx = num(X(mk.at)), cy = num(zOfL(mk.l));
    m += '<circle class="ts3-mark" cx="' + cx + '" cy="' + cy + '" r="2.4"/><circle class="ts3-dot" cx="' + cx + '" cy="' + cy + '" r="0.8"/>';
  }

}
function draw() {
  controller.set({ table: angle, lp: M.lp, la: M.asm, flag: M.flag });
  traces();
  const price = pOf(M.lp), peak = pOf(M.peak);
  let text;
  if (M.sold) text = "VENDU à " + fr(M.sale) + " · −5 % du plus haut";
  else if (clock - rearmedAt < 1.6) text = "réarmé : achat à " + fr(M.entry) + " · stop " + fr(peak * (1 - TRAIL));
  else text = "cours " + fr(price) + " · plus haut " + fr(peak) + " · stop " + fr(peak * (1 - TRAIL));
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuenow", price.toFixed(2));
  stage.setAttribute("aria-valuetext", text + " · plateau " + Math.round(angle) + "°");
}

// ---- Boucle ----
let touringPrice = true, touringTurn = true, last = 0, visible = false, idle = 0, slow = 0, skip = false;
function advance(dt, calm) {
  clock += dt;
  if (touringPrice) M.target = tourPrice(dt);

  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;

  if (which !== "turn") touringPrice = false;

stage.addEventListener("pointerdown", (event) => {
  drag = { x: event.clientX, y: event.clientY, angle: angleTarget, l: M.target, axis: null, id: event.pointerId };
});

  if (!drag || event.pointerId !== drag.id) return;
  const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
  if (!drag.axis) {
    if (Math.hypot(dx, dy) < 4) return;
    drag.axis = Math.abs(dx) > Math.abs(dy) ? "turn" : "price";
    stage.setPointerCapture(event.pointerId);
    stage.classList.add("is-dragging");
  }
  const scale = 640 / stage.getBoundingClientRect().width;
  if (drag.axis === "turn") { hold("turn"); angleTarget = drag.angle + dx * scale * 0.3; }

  run();
});

stage.addEventListener("pointerup", end);
stage.addEventListener("pointercancel", end);
stage.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? Math.log(1.05) : Math.log(1.01);
  if (event.key === "ArrowUp") { hold("price"); M.target = clampL(M.target + step); }
  else if (event.key === "ArrowDown") { hold("price"); M.target = clampL(M.target - step); }
  else if (event.key === "ArrowLeft") { hold("turn"); angleTarget -= 15; }
  else if (event.key === "ArrowRight") { hold("turn"); angleTarget += 15; }
  else return;
  event.preventDefault();
  settleStill();
  run();
});
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

// Remplit la bande avant le premier dessin ; en mouvement réduit, s'arrête juste après une vente.
for (let i = 0; i < 30 * 15; i++) advance(1 / 30, false);
if (still.matches) { touringPrice = touringTurn = false; let n = 0; while (!(M.sold && M.soldClock > 0.9) && n++ < 30 * 30) advance(1 / 30, false); }

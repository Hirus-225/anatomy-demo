</div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Blocs clairs : ce qui reste du brut, tranche par tranche</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Plaques soulevées par les lames : l'ITS de chaque tranche</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Barre dans la gouttière : la CNPS, arrêtée par la butée du plafond</span><span class="iso-key"><svg class="iso-swatch" data-mark="dotted" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Jetons : RICF (demi-parts) et CMU (personnes) ; liasse : transport</span></span><span class="iso-caption">Le brut entre par la trémie et sort en lingot. Il remplit les compartiments du barème l'un après l'autre : 0 % jusqu'à 75 000, puis 16, 21, 24, 28 et 32 %. Dans chaque compartiment, la lame coupe à la hauteur du taux et soulève la part d'ITS. Au pied du lingot, 6,3 % sont détachés pour la CNPS, mais la barre s'arrête à la butée de 3 375 000 : au-delà, la retenue n'augmente plus. Chaque demi-part au-dessus de 1 rend 5 500 sur l'ITS, chaque personne couverte coûte 500 de CMU, et la prime de transport de 30 000 arrive à la sortie sans passer par les lames.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [

  set("ricfnote", s.ricf > s.itsBrut ? "limitée à l'ITS brut : " + sp(s.ricfUsed) + " réellement déduits" : "");
  set("itsnet", sp(s.itsNet));
  set("persons", s.persons + (s.persons > 1 ? " personnes" : " personne"));
  set("cmu", sp(s.cmu));
  set("transport", sp(s.transport));
  set("gains", sp(s.brut + s.transport));
  set("ret", sp(s.withheld));
  set("net", money(s.net));
  set("rate", pct(s.rate).replace(/\u202f/g, "\u00a0"));
  out.textContent = money(s.brut);
  range.setAttribute("aria-valuetext", money(s.brut));
  const line = "net " + money(s.net) + " · retenue " + pct(s.rate).replace(/\u202f/g, "\u00a0");
  if (readout.textContent !== line) readout.textContent = line;
  document.querySelectorAll("[data-case]").forEach((btn) => {
    const [b, p, n] = CASES[Number(btn.dataset.case)];
    btn.setAttribute("aria-pressed", String(b === state.b && p === state.parts && n === state.persons));
  });
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  const ease = (from, to, seconds) => (calm ? to : from + (to - from) * (1 - Math.exp(-dt / seconds)));
  if (calm || !tween) shown = state.b;
  else {
    const u = Math.min(1, (now - tween.t0) / tween.dur);
    shown = tween.from + (tween.to - tween.from) * (1 - Math.pow(1 - u, 3));
    if (u >= 1) { shown = tween.to; tween = null; }
  }
  const s = payslip(state.b, state.parts, state.persons);
  let busy = shown !== state.b;
  for (const t of tokens) {
    const g = goal(t, s);
    t.lift = ease(t.lift, g.lift, 0.16);
    t.alpha = ease(t.alpha, g.alpha, 0.16);
    if (Math.abs(t.lift - g.lift) < 0.02) t.lift = g.lift;
    if (Math.abs(t.alpha - g.alpha) < 0.005) t.alpha = g.alpha;
    if (t.lift !== g.lift || t.alpha !== g.alpha) busy = true;
    t.el.setAttribute("transform", translateAlong(P, [0, 0, t.lift]));
    t.el.setAttribute("opacity", t.alpha.toFixed(3));
  }
  draw();
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
function update() { glide(state.b, 0.62 * 1000); sheet(); run(); }

range.addEventListener("input", () => { state.b = Number(range.value); update(); });
document.querySelectorAll('input[name="parts"]').forEach((el) => el.addEventListener("change", () => { state.parts = Number(el.value); update(); }));
document.querySelectorAll('input[name="persons"]').forEach((el) => el.addEventListener("change", () => { state.persons = Number(el.value); update(); }));
document.querySelectorAll("[data-case]").forEach((btn) => btn.addEventListener("click", () => {
  const [b, p, n] = CASES[Number(btn.dataset.case)];
  state.b = b; state.parts = p; state.persons = n;
  range.value = String(b);
  document.querySelector('input[name="parts"][value="' + p + '"]').checked = true;
  document.querySelector('input[name="persons"][value="' + n + '"]').checked = true;
  update();
}));

// survol d'une ligne du bulletin : la machine montre d'où vient ce montant
const focus = (key) => { if (key) svg.setAttribute("data-focus", key); else svg.removeAttribute("data-focus"); };
document.querySelectorAll(".pa-slip tr[data-row]").forEach((row) => {
  row.addEventListener("pointerenter", () => focus(row.dataset.row));
  row.addEventListener("pointerleave", () => focus(null));
});
svg.addEventListener("pointerover", (event) => {
  const part = event.target.closest("[data-k]");
  const key = part ? part.dataset.k.split(" ")[0] : null;
  document.querySelectorAll(".pa-slip tr[data-on]").forEach((row) => row.removeAttribute("data-on"));
  if (key) document.querySelectorAll('.pa-slip tr[data-row="' + key + '"]').forEach((row) => row.setAttribute("data-on", ""));
  focus(key);
});
svg.addEventListener("pointerleave", () => { focus(null); document.querySelectorAll(".pa-slip tr[data-on]").forEach((row) => row.removeAttribute("data-on")); });

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible && intro && !still.matches) { intro = false; shown = 0; drawn.q = -1; glide(state.b, 1700); }
  if (visible) run();
}, { rootMargin: "80px 0px" }).observe(stage);
sheet();
draw();
</script></body></html>
